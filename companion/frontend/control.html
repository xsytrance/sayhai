<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>talk to it</title>
  <style>
    :root { --accent: #58e0c8; --bg: #0b0b18; --panel: #16162a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(120% 100% at 50% 0%, #1a1a38, var(--bg));
      color: #e8eefc;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; height: 100dvh;
    }
    header {
      padding: 14px 16px; font-size: 18px; font-weight: 700;
      border-bottom: 1px solid rgba(120,200,255,0.14);
      display: flex; align-items: center; gap: 8px;
    }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5d6c; box-shadow: 0 0 8px #ff5d6c; }
    header .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    header small { font-weight: 400; color: #8d9ac4; font-size: 12px; margin-left: auto; }

    #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 13px; border-radius: 14px; line-height: 1.35; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
    .me { align-self: flex-end; background: #2b6cff; border-bottom-right-radius: 4px; }
    .it { align-self: flex-start; background: var(--panel); border: 1px solid rgba(120,200,255,0.12); border-bottom-left-radius: 4px; }
    .it .emo { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); margin-bottom: 3px; }
    .note { align-self: center; font-size: 12px; color: #c9a14a; text-align: center; max-width: 90%; }
    .thinking { align-self: flex-start; color: #8d9ac4; font-style: italic; font-size: 14px; }

    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(120,200,255,0.14); }
    input {
      flex: 1; padding: 13px 14px; font-size: 16px; border-radius: 12px;
      border: 1px solid rgba(140,160,210,0.25); background: #11112299; color: #fff; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 0 18px; font-size: 16px; font-weight: 600; border: none; border-radius: 12px;
      background: var(--accent); color: #042b25; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <span id="name">companion</span>
    <small>talk to it — it answers out loud on the screen</small>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="text" autocomplete="off" placeholder="say something…" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("text");
    const send = document.getElementById("send");
    const dot = document.getElementById("dot");

    function add(cls, html) {
      const d = document.createElement("div");
      d.className = cls; d.innerHTML = html;
      log.appendChild(d); log.scrollTop = log.scrollHeight;
      return d;
    }
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    fetch("/api/emotions").then((r) => r.json()).then((j) => {
      if (j.name) { document.getElementById("name").textContent = j.name; document.title = j.name; }
      dot.classList.add("on");
    }).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("msg me", esc(text));
      send.disabled = true;
      const thinking = add("thinking", "thinking…");
      try {
        const r = await fetch("/api/say", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const j = await r.json();
        thinking.remove();
        add("msg it", `<span class="emo">${esc(j.emotion || "")}</span>${esc(j.text || "")}`);
        if (j.voice_error) add("note", "🔇 voice off: " + esc(j.voice_error.split("\n")[0]));
      } catch (err) {
        thinking.remove();
        add("note", "couldn't reach it — is the server running?");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
